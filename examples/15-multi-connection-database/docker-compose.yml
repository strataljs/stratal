services:
  postgres-main:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stratal_main
      POSTGRES_USER: stratal
      POSTGRES_PASSWORD: stratal
    ports:
      - "6432:5432"
    volumes:
      - stratal-main-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratal -d stratal_main"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-analytics:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stratal_analytics
      POSTGRES_USER: stratal
      POSTGRES_PASSWORD: stratal
    ports:
      - "7432:5432"
    volumes:
      - stratal-analytics-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratal -d stratal_analytics"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  stratal-main-pgdata:
  stratal-analytics-pgdata:
