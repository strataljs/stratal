name: "Setup"
description: "Enable corepack, setup Node.js with yarn cache, and install dependencies"

runs:
  using: "composite"
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: "22"
        cache: "yarn"

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
